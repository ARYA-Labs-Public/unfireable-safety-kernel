# Dependabot config for the safety-kernel public repo.
#
# Keeps GitHub Actions and pip deps current (cargo: see below). Actions are
# pinned to commit SHAs per repo security policy; Dependabot proposes
# both the new SHA and the new comment tag together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  # No cargo updates here. Cargo.toml and Cargo.lock are published from the
  # internal canonical repository, and each publish replaces them, so a cargo
  # bump merged here would be overwritten by the next publish. Rust dependency
  # updates and the RustSec advisory gate run in the canonical repository.

  - package-ecosystem: pip
    directory: /py-defense
    schedule:
      interval: weekly
    labels: [dependencies, python]
