name: ✨ Feature request
description: Propose a new capability, integration, or improvement.
title: "feat: <one-line summary>"
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Please note the scope rules in
        [CONTRIBUTING.md](https://github.com/ARYA-Labs-Public/unfireable-safety-kernel/blob/main/CONTRIBUTING.md): changes that touch the
        **security model** (fail-closed semantics, signature schemes, the
        transparency log, circuit-breaker invariants, the OpenAPI contract)
        require a **Discussion first**, before any code lands. This form is for
        everything else — new examples, SDKs, docs, performance, ergonomics.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you file
      options:
        - label: >-
            I searched [existing issues and Discussions](https://github.com/ARYA-Labs-Public/unfireable-safety-kernel/issues?q=is%3Aissue)
            and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the kernel does not support today? Describe the use case, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? API sketches, example usage, or a rough design are all welcome.
    validations:
      required: true

  - type: dropdown
    id: security-impact
    attributes:
      label: Does this touch the security model?
      description: >-
        Fail-closed semantics, signature/crypto, the transparency log,
        circuit-breaker invariants, the deny-pattern tooling, or the OpenAPI
        contract. If yes, please open a Discussion first — we will link it here.
      options:
        - "No — additive/ergonomic/docs/examples only"
        - "Not sure — please advise"
        - "Yes — and I have (or will) open a Discussion first"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you prefer this one.
    validations:
      required: false

  - type: dropdown
    id: contributing
    attributes:
      label: Would you be willing to contribute this?
      description: No obligation — this just helps us plan. See CONTRIBUTING.md for the DCO/CLA process.
      options:
        - "Yes, I would like to implement it (with maintainer guidance)"
        - "Maybe, with help"
        - "No, I am requesting it"
    validations:
      required: true

  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: >-
            I agree to follow this project's
            [Code of Conduct](https://github.com/ARYA-Labs-Public/unfireable-safety-kernel/blob/main/CODE_OF_CONDUCT.md).
          required: true
