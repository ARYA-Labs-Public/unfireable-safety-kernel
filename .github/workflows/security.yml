# Security lane — secret scanning + dependency policy.
#
# The Unfireable Safety Kernel is a high-risk repo (it gates AI-agent
# actions and holds signing logic), so secret + supply-chain scanning
# run on every PR and on a weekly schedule.
#
#   - gitleaks: secret scanning. Installed as a binary (the gitleaks
#     GitHub Action wrapper requires a paid license; the binary does
#     not). PR runs scan the diff; push/schedule scan full history so a
#     credential committed and "removed" without rotation is still caught.
#   - cargo-deny: dependency advisories + license/source bans, driven by
#     the repo's deny.toml.
#
# Actions pinned to commit SHAs per SECURITY.md (tag retained as comment).

name: Security Lane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'   # Mondays 07:17 UTC — catch newly-disclosed advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # Secret scanning — gitleaks binary (no license required)
  # ===========================================================
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history on push/schedule/dispatch; shallow on PRs (diff scan).
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (PR — diff)
        if: github.event_name == 'pull_request'
        run: gitleaks detect --source . --redact --no-banner -v --log-opts="--no-merges origin/${{ github.base_ref }}..HEAD"

      - name: Run gitleaks (push/schedule — full history)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --redact --no-banner -v

  # ===========================================================
  # Dependency policy — cargo-deny over deny.toml
  # ===========================================================
  cargo-deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # On PRs we need the merge commit's first parent (the base) to
          # diff against; push/schedule/dispatch always run the full check.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Decide whether this PR touches the dependency graph
        # A PR that only bumps a GitHub Action or edits docs cannot change
        # the cargo dependency graph, so re-running cargo-deny on it only
        # reports advisories that already exist on main (and were already
        # reported by the push/schedule run). That made every Dependabot
        # actions/docker bump go red for a rustls advisory it had nothing
        # to do with. Gate the PR run on the files that can actually
        # change what cargo-deny sees; main still gets the full check on
        # every push and every Monday.
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^rust-toolchain\.toml$|^\.cargo/|^\.github/workflows/security\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml/Cargo.lock/deny.toml change in this PR; cargo-deny skipped (main is still checked on push + weekly)."
          fi

      - name: Install Rust toolchain
        if: steps.deps.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        if: steps.deps.outputs.run == 'true'
        # Use the latest cargo-deny: older releases (0.16) bundle a rustsec
        # that cannot parse CVSS 4.0 vectors now present in the advisory DB
        # and fail to even load it. Latest is also the right posture for a
        # security-advisory lane (current advisory parsing).
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        if: steps.deps.outputs.run == 'true'
        # advisories + bans + licenses + sources, all driven by deny.toml.
        run: cargo deny check
