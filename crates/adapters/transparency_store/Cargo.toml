# qorch-transparency-store — append-only Merkle ledger
# storage adapter (Postgres + in-memory). The only place I/O is allowed
# for the transparency log; the service consumes it as
# `Arc<dyn TransparencyStore>`. Relocated from arya-core's
# `crates/adapters/arya-core-transparency-log` by a mechanical rename.
[package]
name = "qorch-transparency-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Append-only Merkle transparency-log storage adapter (Postgres + in-memory) for the safety-kernel."

[lib]
name = "qorch_transparency_store"
path = "src/lib.rs"

[dependencies]
qorch-domain = { path = "../../domain", version = "0.1.0" }
async-trait = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Used only by tests/migration_checksum_pin.rs to recompute the SHA-384
# checksum of the shipped migration file (the same digest sqlx records in
# `_sqlx_migrations` and re-verifies on every boot); the crate's runtime
# dependency graph is unchanged.
sha2 = { workspace = true }

[lints.rust]
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
