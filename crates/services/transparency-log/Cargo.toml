# qorch-transparency-log
#
# Append-only Merkle transparency-log HTTP service. It implements the
# RFC-6962 core: `/v1/append`, `/v1/verify/{id}`, `/v1/sth`, and
# `/v1/consistency` for inclusion and consistency proofs backed by
# Ed25519-signed tree heads. Beyond the RFC-6962 core it also serves the
# ceremony wave-session routes, the MCP audit-record append endpoint, and
# a route publishing the service's Ed25519 verification key.
#
# Relocated into this repo (the canonical safety-kernel repo) from
# arya-core's `crates/services/arya-core-transparency-service` by a
# mechanical rename; the public repo receives it through the IP-filter
# cut. The kernel POSTs every successful authorization here fail-closed.
#
# Listens on internal port 8100, exposed on host port 8102.
#
# `src/clock.rs` carries a local `SystemClock`; this workspace has no
# shared adapters crate to supply one.
#
# `rustls` and `rcgen` here use the `ring` crypto provider. There is no
# `aws-lc-rs` and no `native-tls` anywhere in this dependency graph.

[package]
name = "qorch-transparency-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Append-only Merkle transparency-log HTTP service (RFC-6962 inclusion + consistency proofs, Ed25519 signed tree heads)."

[lib]
name = "qorch_transparency_log"

[[bin]]
name = "qorch-transparency-log"
path = "src/main.rs"


[dependencies]
qorch-domain = { path = "../../domain", version = "0.1.0" }
qorch-transparency-store = { path = "../../adapters/transparency_store", version = "0.1.0" }

axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rusqlite = { workspace = true }
lru = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
async-trait = { workspace = true }

# `migrate` is opted in HERE and only here, so the binary can call
# `sqlx::migrate!` to apply the schema on boot. The storage adapter crate
# deliberately does not enable it — migrations are the service binary's
# responsibility, not the storage trait's.
sqlx = { workspace = true, features = ["migrate"] }

# `signal` is needed because `main.rs` installs a SIGTERM/SIGINT handler
# for graceful shutdown. arya-core's workspace `tokio` does not carry it,
# since nothing in the repo needed a signal handler before this service
# arrived.
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }
rand_core = { workspace = true }
rcgen = { workspace = true }

[lints.rust]
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
