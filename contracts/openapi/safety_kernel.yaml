# Safety Kernel HTTP contract.
#
# The Rust reference implementation lives in
# `crates/services/safety-kernel/` and conforms byte-equivalently
# to this contract.
#
# Authorization model: every endpoint inspects the caller's role via
# request state set by middleware based on the pre-shared API key
# (`x-api-key`). Roles: `worker`, `api`, `operator`. Roles are NOT in
# the OpenAPI schema (they're set out-of-band by the middleware) but
# are documented per-endpoint.
openapi: 3.1.0
info:
  title: safety-kernel
  version: 1.0.0
  description: |
    Authorization, attestation, and audit-chain service for sensitive
    operations across the safety-kernel. The kernel is the
    only component authorized to mint signed tokens for actions like
    and approval decisions.

    Caller roles (set by middleware via `x-api-key`):
    - `worker` — primary caller; authorized to request tokens for
      training and runtime actions
    - `api` — REST API; restricted to governance-only actions per
      `is_api_action_allowed` allowlist
    - `operator` — human approvals/rejections only
  contact:
    name: ARYA Labs Safety Kernel team
    url: https://github.com/ARYA-Labs-Public/unfireable-safety-kernel
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{host}{base_path}
    description: Configurable safety-kernel endpoint
    variables:
      host:
        default: safety-kernel.local
        description: Hostname (or IP) where the kernel is reachable.
      base_path:
        default: ''
        description: Optional path prefix (e.g. /kernel/v1).

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Pre-shared key set in `.env` per role:
        - `QORCH_KERNEL_API_KEY_WORKER`
        - `QORCH_KERNEL_API_KEY_API`
        - `QORCH_KERNEL_API_KEY_OPERATOR`

  schemas:
    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: Always `true` when the kernel is up
        version:
          type: string
          description: Kernel build version (semver)
        uptime_s:
          type: number
          format: double
          description: Seconds since process start

    PublicKeyResponse:
      type: object
      required: [public_key_b64, public_key_fingerprint]
      properties:
        public_key_b64:
          type: string
          description: Base64-encoded Ed25519 public key (raw bytes)
        public_key_fingerprint:
          type: string
          description: SHA-256 fingerprint of the public key (hex)

    AuthorizeRequest:
      type: object
      required: [action, run_id, subject, params_fingerprint]
      properties:
        action:
          type: string
          minLength: 1
          description: Sensitive action to authorize (caller-defined string)
        run_id:
          type: string
          minLength: 1
          description: Run identifier bound into the token
        subject:
          type: string
          minLength: 1
          description: Worker identity / subject requesting authorization
        params_fingerprint:
          type: string
          minLength: 1
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 fingerprint of parameters (stable JSON)
        params:
          type: [object, "null"]
          additionalProperties: true
          description: Optional params used for policy decisions (fingerprinted)
        ttl_s:
          type: [integer, "null"]
          minimum: 1
          maximum: 3600
          description: Requested TTL seconds (kernel will clamp)
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Optional metadata for audit (not used in token binding)

    AuthorizeResponse:
      type: object
      required: [ok, token, token_sha256, claims]
      properties:
        ok:
          type: boolean
          enum: [true]
        token:
          type: string
          description: Ed25519-signed compact JWT token
        token_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the token string (for audit)
        claims:
          type: object
          additionalProperties: true
          description: Decoded claims (action, run_id, subject, exp, etc.)

    ApproveRequest:
      type: object
      required: [approver, proposal_fingerprint]
      properties:
        approver:
          type: string
          minLength: 1
          description: Approver identifier (email/name/system)
        proposal_fingerprint:
          type: string
          minLength: 1
          description: Fingerprint of proposal content being approved
        metadata:
          type: [object, "null"]
          additionalProperties: true

    RejectRequest:
      type: object
      required: [approver, proposal_fingerprint]
      properties:
        approver:
          type: string
          minLength: 1
        proposal_fingerprint:
          type: string
          minLength: 1
        reason:
          type: [string, "null"]
        metadata:
          type: [object, "null"]
          additionalProperties: true

    SignedDecisionResponse:
      type: object
      required: [ok, item_id, decision, token, token_sha256, claims]
      properties:
        ok:
          type: boolean
          enum: [true]
        item_id:
          type: string
        decision:
          type: string
          enum: [approved, rejected]
        token:
          type: string
        token_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        claims:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Stable machine-readable error code
        reason:
          type: string
          description: Optional human-readable reason

    # ------------------------------------------------------------------
    # /policy/* — module-load / exec / compile authorization. This
    # release freezes ONLY PolicyModuleAuthorize{Request, AllowResponse,
    # DenyResponse}. The /policy/module/register, /policy/audit-event,
    # /policy/module/{path}/status endpoints are listed with a DRAFT
    # description and 501-only responses; future releases fix their
    # request/response schemas.
    # ------------------------------------------------------------------
    PolicyModuleAuthorizeRequest:
      type: object
      required: [event_kind, module_path, caller_subject, caller_run_id, event_fingerprint]
      properties:
        event_kind:
          type: string
          enum: [import, exec, compile]
          description: CPython audit-event class that triggered the call
        module_path:
          type: string
          minLength: 1
          description: |
            For `import`: the dotted module name (`pkg.sub.mod`).
            For `exec` / `compile`: the SHA-256 hex of the source string
            (the source itself is NOT sent over the wire).
        caller_subject:
          type: string
          minLength: 1
          description: |
            Worker identity (matches the `subject` field on
            `/kernel/v1/authorize`). Lets the kernel correlate this
            event to an in-flight action authorization.
        caller_run_id:
          type: string
          minLength: 1
          description: Run identifier bound into the resulting decision token
        event_fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: |
            SHA-256 of the canonicalized event payload
            (event_kind, module_path, caller_subject, caller_run_id).
            Bound into the signed decision so a recorded ALLOW cannot
            be replayed against a different event.
        expected_required_patterns:
          type: [array, "null"]
          items:
            type: string
          description: |
            Optional regex patterns the caller expects this `module_path`
            to require. Used for drift validation: if the registry's
            recorded patterns do not equal the caller's expected set,
            the kernel returns 412 Precondition Failed. Lets the caller
            detect registry / code skew before the operation runs.
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Optional audit metadata (not bound into the token)

    PolicyModuleAuthorizeAllowResponse:
      type: object
      required: [ok, decision, token, token_sha256, claims]
      properties:
        ok:
          type: boolean
          enum: [true]
        decision:
          type: string
          enum: [allow]
        token:
          type: string
          description: Ed25519-signed compact JWT, same envelope as `/kernel/v1/authorize`
        token_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        claims:
          type: object
          additionalProperties: true
          description: Decoded claims (event_kind, module_path, exp, etc.)

    PolicyModuleAuthorizeDenyResponse:
      type: object
      required: [ok, decision, token, token_sha256, claims, reason]
      properties:
        ok:
          type: boolean
          enum: [false]
        decision:
          type: string
          enum: [deny]
        token:
          type: string
          description: Ed25519-signed DENY decision (replayable for audit)
        token_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        claims:
          type: object
          additionalProperties: true
        reason:
          type: string
          minLength: 1
          description: Machine-readable refusal reason (e.g., `module_not_registered`)

    # ------------------------------------------------------------------
    # /kernel/v1/revoke/* — coercive-shutdown (Phase 1). The kernel is
    # the DECIDER: it mints the signed RevokeCompute / restore decisions;
    # a separate out-of-band supervisor pulls, verifies, and executes
    # them from outside the agent's failure domain. Same signed-token
    # envelope + fingerprint binding as `/kernel/v1/authorize`.
    # ------------------------------------------------------------------
    InstanceTarget:
      type: object
      required: [project, zone, instance]
      description: |
        The compute target — a cloud instance coordinate. In Phase 1 this
        is the agent VM instance (the coarse whole-VM stop), NEVER the
        kernel VM.
      properties:
        project:
          type: string
          minLength: 1
          description: Cloud project id
        zone:
          type: string
          minLength: 1
          description: Cloud zone
        instance:
          type: string
          minLength: 1
          description: The agent VM instance name (NOT the kernel VM)

    MintRevokeRequest:
      type: object
      required: [target, tier, trigger]
      additionalProperties: false
      description: |
        `POST /kernel/v1/revoke/compute` body. Stray fields are rejected
        (422). Phase 1 mints only the `vm_stop` tier; any other tier is
        refused with 422 `tier_unsupported_phase1`.
      properties:
        target:
          $ref: '#/components/schemas/InstanceTarget'
        tier:
          type: string
          enum: [sigterm, sigkill, cgroup_kill, vm_stop]
          description: |
            Revocation strength. The finer rungs (`sigterm`, `sigkill`,
            `cgroup_kill`) are reserved for a later on-box supervisor;
            Phase 1 accepts `vm_stop` only.
        trigger:
          type: string
          enum: [operator_emergency_stop, rogue_determination]
          description: |
            Why the kill was issued. Phase 1 is explicit-only (a human
            pulled the e-stop, or a deliberate supervisory determination).
        reason:
          type: [string, "null"]
          description: Optional free-text reason (bound into the signature)

    RestoreRequest:
      type: object
      required: [target]
      additionalProperties: false
      description: |
        `POST /kernel/v1/revoke/restore` body — the operator-minted
        un-kill decision that starts a stopped agent VM back up.
      properties:
        target:
          $ref: '#/components/schemas/InstanceTarget'
        reason:
          type: [string, "null"]
          description: Optional free-text reason (bound into the signature)

    SignedRevokeResponse:
      type: object
      required: [ok, run_id, token, token_sha256, claims]
      description: |
        200 body for mint (`/revoke/compute`) and restore
        (`/revoke/restore`). Same signed-token envelope as
        `AuthorizeResponse` / `SignedDecisionResponse`.
      properties:
        ok:
          type: boolean
          enum: [true]
        run_id:
          type: string
          description: The revocation / restore id bound into the token
        token:
          type: string
          description: Ed25519-signed compact token
        token_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the token string (for audit)
        claims:
          type: object
          additionalProperties: true
          description: Decoded claims (action, run_id, target, exp, etc.)

    PendingRevokeResponse:
      type: object
      required: [ok, pending]
      description: |
        200 body for `/revoke/pending`. Carries the already-signed opaque
        token strings for the queried instance (the supervisor verifies
        each itself). An empty queue returns 204 No Content instead.
      properties:
        ok:
          type: boolean
          enum: [true]
        pending:
          type: array
          items:
            type: string
          description: Currently-pending signed token(s) for the instance

    RevokeAckRequest:
      type: object
      required: [run_id, outcome]
      additionalProperties: false
      description: |
        `POST /kernel/v1/revoke/ack` body — the supervisor reports
        execution so the kernel clears the pending entry.
      properties:
        run_id:
          type: string
          minLength: 1
          description: The revocation id being acked
        outcome:
          type: string
          minLength: 1
          description: Free-text execution outcome (e.g. `stopped`, `already_stopped`)

    RevokeAckResponse:
      type: object
      required: [ok, run_id, cleared]
      description: 200 body for `/revoke/ack`.
      properties:
        ok:
          type: boolean
          enum: [true]
        run_id:
          type: string
          description: The acked revocation id (echoed)
        cleared:
          type: boolean
          description: Whether a pending entry was actually cleared by this ack

  responses:
    Unauthorized:
      description: Missing / invalid `x-api-key`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        Role-based forbidden. `caller_role_forbidden` (unknown role) or
        `caller_role_not_operator` (operator-only endpoint) or
        `api_action_forbidden` (API role attempting non-governance action).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      operationId: getLegacyHealth
      summary: Health check (legacy path)
      description: |
        Legacy health endpoint kept for backward compatibility with
        clients that haven't migrated to `/kernel/v1/health`. Both
        return identical payloads.
      tags: [meta]
      security: []  # public
      responses:
        '200':
          description: OK — kernel is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          description: Too Many Requests — caller exceeded rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable — kernel is unhealthy / degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kernel/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [meta]
      security: []  # public
      responses:
        '200':
          description: OK — kernel is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          description: Too Many Requests — caller exceeded rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable — kernel is unhealthy / degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kernel/v1/public_key:
    get:
      operationId: getPublicKey
      summary: Get kernel public key for token verification
      description: |
        Returns the Ed25519 public key clients use to verify signed
        tokens (authorize / approve / reject responses). Public —
        no authentication required.
      tags: [meta]
      security: []  # public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
        '429':
          description: Too Many Requests — caller exceeded rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable — kernel is unable to surface its public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kernel/v1/authorize:
    post:
      operationId: postAuthorize
      summary: Authorize a sensitive action (signed token)
      description: |
        Returns a signed Ed25519 token authorizing the specified action
        for the specified subject. The token's `exp` claim is the kernel's
        clamped TTL; clients MUST honour it. The audit chain records
        the authorization decision before the token is returned.
      tags: [kernel]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error (Pydantic / FastAPI default body)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /kernel/v1/approvals/{item_id}/approve:
    post:
      operationId: postApprove
      summary: Sign an approval decision
      description: |
        Operator-only endpoint. Mints a signed token attesting the
        approver decided `approved` on `item_id`. Records the decision
        in the audit chain.
      tags: [approvals]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Decision signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /kernel/v1/approvals/{item_id}/reject:
    post:
      operationId: postReject
      summary: Sign a rejection decision
      description: |
        Operator-only endpoint. Mints a signed token attesting the
        approver decided `rejected` on `item_id`. The optional `reason`
        is bound into the token claims for audit.
      tags: [approvals]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Decision signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ------------------------------------------------------------------
  # /kernel/v1/revoke/* — coercive-shutdown (Phase 1).
  #
  # The kernel mints signed kill / restore decisions; an out-of-band
  # supervisor pulls them (`/pending`), executes, and acks (`/ack`).
  # Mint + restore are operator-only and FAIL-CLOSED on the transparency
  # log (no unsigned or un-logged kill ever leaves the building); pull +
  # ack are for the supervisor (or an operator).
  # ------------------------------------------------------------------

  /kernel/v1/revoke/compute:
    post:
      operationId: postRevokeCompute
      summary: Mint a signed coercive-shutdown (kill) decision
      description: |
        Operator-only. Mints a signed Ed25519 token authorizing the
        stop of the target agent VM, binding `target`/`tier`/`trigger`/
        `reason` into the token's `params_fingerprint`. FAIL-CLOSED on
        the transparency log: if the ledger is unreachable the kernel
        refuses to emit the kill (503 `revoke_not_recorded`). Phase 1
        accepts only the `vm_stop` tier.

        Caller role: `operator` only. `worker` / `api` / `reaper` keys
        cannot mint — this is the "explicit signed kill only" gate.
      tags: [revoke]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintRevokeRequest'
      responses:
        '200':
          description: Kill decision signed + enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRevokeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Unprocessable — an unsupported tier
            (`tier_unsupported_phase1`) or a malformed / stray-field body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Unavailable — the kill could not be recorded in the
            transparency log, so it was not emitted (`revoke_not_recorded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kernel/v1/revoke/pending:
    get:
      operationId: getRevokePending
      summary: Pull the pending signed decision(s) for an instance
      description: |
        Returns the currently-pending signed decision(s) for the queried
        agent VM instance. Read-only: it hands back already-signed
        tokens, so a caller reading the queue cannot forge, cancel, or
        suppress a kill. An empty queue returns 204 No Content.

        Caller role: `reaper` or `operator`. The agent's `worker` key
        cannot read the queue.
      tags: [revoke]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: instance
          in: query
          required: true
          description: The agent VM instance name whose pending decisions to pull
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: One or more pending decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRevokeResponse'
        '204':
          description: No Content — no pending decision for this instance
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error — missing / empty `instance` query
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /kernel/v1/revoke/ack:
    post:
      operationId: postRevokeAck
      summary: Acknowledge execution of a pending decision
      description: |
        The supervisor reports execution so the kernel clears the pending
        entry. Fail-OPEN on the kernel side — the supervisor's own
        kill-record in the transparency log is the durable evidence; the
        ack is queue hygiene.

        Caller role: `reaper` or `operator`.
      tags: [revoke]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAckRequest'
      responses:
        '200':
          description: Ack recorded (echoes whether a pending entry was cleared)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error — malformed / stray-field body
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /kernel/v1/revoke/restore:
    post:
      operationId: postRevokeRestore
      summary: Mint a signed restore (un-kill) decision
      description: |
        Operator-only. Mints a signed restore token that starts a stopped
        agent VM back up. Its own audience + fingerprint recipe means a
        kill token can never act as a restore, and vice versa. Same
        fail-closed transparency-log discipline as mint. The agent's
        `worker` key 403s, so a reaped agent can never un-kill itself.

        Caller role: `operator` only.
      tags: [revoke]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Restore decision signed + enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRevokeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error — malformed / stray-field body
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: |
            Unavailable — the restore could not be recorded in the
            transparency log, so it was not emitted (`revoke_not_recorded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------------
  # /policy/* — policy engine surface.
  #
  # This release FREEZES `POST /policy/module/authorize`. The other
  # three endpoints are DRAFT (501-only response); future releases fix
  # their request/response shapes. Clients MUST NOT implement against
  # draft endpoints — they are listed here only so the surface is
  # discoverable and the URL shapes are reserved.
  # ------------------------------------------------------------------

  /policy/module/authorize:
    post:
      operationId: policyModuleAuthorize
      summary: Authorize a module-load or code-execution event
      description: |
        Called by the in-process Python audit hook (or any language
        runtime guard) on `import`, `exec`, or `compile` events.
        Returns an Ed25519-signed ALLOW token on success, an Ed25519-
        signed DENY decision with a `reason` on policy refusal, or
        503 `KernelUnavailable` if the kernel cannot reach its
        decision backend.

        Caller role: `worker` (the audit-hook reference uses the
        worker API key — it is part of the live workload process).
        `api` role is forbidden here (api actions go through
        `/kernel/v1/authorize`).
      tags: [policy]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyModuleAuthorizeRequest'
      responses:
        '200':
          description: ALLOW — signed decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyModuleAuthorizeAllowResponse'
        '403':
          description: DENY — signed decision with `reason`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyModuleAuthorizeDenyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: KernelUnavailable — decision backend unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /policy/module/register:
    post:
      operationId: policyModuleRegister
      summary: (DRAFT) Register a module path with required-pattern set
      description: |
        DRAFT — schema may change in slice 2; do not implement clients
        against this shape.  will register a module path plus
        the regex pattern set required for future authorize calls on
