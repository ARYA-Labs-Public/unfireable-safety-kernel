# ARYA Labs — safety-kernel Python audit-hook reference
# Stdlib-only by design. NO httpx / requests / fastapi deps.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safety_kernel_defense"
version = "0.2.0"
description = "Layer-1 Python audit-hook reference for the safety-kernel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "ARYA Labs PBC" },
]
keywords = ["safety-kernel", "audit-hook", "import-discipline", "PEP-578"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Stdlib-only. the architecture overview design §2 mandate — every additional
# dependency widens the bootstrap window the hook lives inside.
dependencies = []

[project.optional-dependencies]
# FastAPI request-gate middleware + revoke-client SDK. The CORE package
# stays stdlib-only; these deps are only pulled when a caller wants the
# middleware / revoke client: `pip install safety-kernel-defense[fastapi]`.
fastapi = [
    "fastapi",
    "starlette",
    "httpx",
    "cryptography",
]
test = [
    "pytest>=7.0",
    "coverage[toml]>=7.0",
]

[project.urls]
Homepage = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel"
Documentation = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel/blob/main/docs/integration/python-fastapi.md"
Issues = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["safety_kernel_defense*"]

[tool.pytest.ini_options]
testpaths = ["safety_kernel_defense/tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["safety_kernel_defense"]
omit = [
    "safety_kernel_defense/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# ≥95% target.
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Tests intentionally use broad excepts, magic values, etc.
per-file-ignores = { "safety_kernel_defense/tests/*" = ["B017", "S101", "PLR2004"] }

[tool.ruff.format]
quote-style = "double"
